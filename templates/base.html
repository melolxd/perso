<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ATP Predictor Terminal{% endblock %}</title>

  <!-- Google Fonts: Oxanium pour les titres, Share Tech Mono pour les données -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@300;400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  
  <!-- Icônes (Bootstrap Icons) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <!-- Votre CSS custom -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
  <!-- Canvas pour l'animation de fond subtile -->
  <canvas id="background-canvas"></canvas>

  <div class="container">
    <header class="main-header">
      <h1 id="main-title"></h1> <!-- Sera rempli par JS avec un effet machine à écrire -->
      <nav>
        <a href="{{ url_for('index') }}">› Terminal de Prédiction</a>
        <a href="{{ url_for('history') }}">› Archives des Données</a>
      </nav>
    </header>

    <main>
      {% block content %}{% endblock %}
    </main>
  </div>
  
  <!-- Librairies JS (placées à la fin pour un chargement optimal) -->
  <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
  <!-- Votre JS custom -->
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
